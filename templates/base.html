<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}بنك طب نساء{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ── Design tokens ─────────────────────────────────────────────── */
        :root {
            --ff: 'Alexandria', 'Segoe UI', Tahoma, sans-serif;
            --blue-1: #2b3af7;
            --blue-2: #4f5ef9;
            --cyan:   #00c6ff;
            --green:  #22c55e;
            --red:    #ef4444;
            --amber:  #f59e0b;
            --bg-grad: linear-gradient(135deg, #1e3a8a 0%, #3730a3 40%, #0891b2 100%);
            --card-bg: rgba(255,255,255,0.97);
            --shadow-sm: 0 2px 12px rgba(0,0,0,.08);
            --shadow-md: 0 8px 32px rgba(0,0,0,.12);
            --shadow-lg: 0 20px 60px rgba(0,0,0,.18);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: all .25s cubic-bezier(.4,0,.2,1);
        }

        /* ── Reset / Base ───────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            min-height: 100vh;
            font-family: var(--ff);
            direction: rtl;
            overflow-x: hidden;
        }

        body {
            background: var(--bg-grad);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ── Animated background ────────────────────────────────────────── */
        .bg-canvas {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background: var(--bg-grad);
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .35;
            animation: blobFloat 14s ease-in-out infinite alternate;
        }
        .bg-blob:nth-child(1){ width:420px; height:420px; top:-80px; right:-100px; background:var(--cyan);    animation-duration:12s; }
        .bg-blob:nth-child(2){ width:340px; height:340px; bottom:-60px; left:-80px; background:var(--blue-1); animation-duration:16s; animation-delay:3s; }
        .bg-blob:nth-child(3){ width:260px; height:260px; top:40%;  left:55%;      background:#818cf8;        animation-duration:10s; animation-delay:6s; }

        @keyframes blobFloat {
            from { transform: translateY(0) scale(1); }
            to   { transform: translateY(-50px) scale(1.08); }
        }

        /* ── Layout ─────────────────────────────────────────────────────── */
        .page-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem 6rem;
            width: 100%;
        }

        .content-wrap {
            width: 100%;
            max-width: 960px;
        }

        /* ── Card ───────────────────────────────────────────────────────── */
        .card {
            border: none;
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        /* ── Buttons ────────────────────────────────────────────────────── */
        .btn {
            font-family: var(--ff);
            font-weight: 600;
            border-radius: 50px;
            transition: var(--transition);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
            border: none;
            color: #fff;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: linear-gradient(135deg, #2235e0, #3a4bf5);
            box-shadow: 0 4px 18px rgba(43,58,247,.4);
            color: #fff;
            transform: translateY(-1px);
        }
        .btn-success {
            background: linear-gradient(135deg, #16a34a, var(--green));
            border: none; color: #fff;
        }
        .btn-success:hover { background: linear-gradient(135deg, #15803d, #16a34a); color:#fff; transform:translateY(-1px); }

        .btn-secondary {
            background: linear-gradient(135deg, #64748b, #94a3b8);
            border: none; color: #fff;
        }
        .btn-secondary:hover { background: linear-gradient(135deg, #475569,#64748b); color:#fff; transform:translateY(-1px); }

        .btn-outline-primary {
            border: 2px solid var(--blue-1); color: var(--blue-1);
        }
        .btn-outline-primary:hover { background:var(--blue-1); color:#fff; }

        /* ── Option items ───────────────────────────────────────────────── */
        .option-item {
            display: flex;
            align-items: center;
            gap: .75rem;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-sm);
            padding: .85rem 1.1rem;
            margin-bottom: .65rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            background: #f8fafc;
            user-select: none;
        }
        .option-item:hover:not(.answered) {
            border-color: var(--blue-2);
            background: #eef2ff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79,94,249,.12);
        }
        .option-item.selected { border-color: var(--blue-2); background:#eef2ff; }

        .option-item.correct {
            border-color: var(--green);
            background: #f0fdf4;
            animation: pulseCorrect .5s ease;
        }
        .option-item.incorrect {
            border-color: var(--red);
            background: #fef2f2;
            animation: shakeWrong .5s ease;
        }

        .option-badge {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748b;
            font-weight: 700;
            font-size: .82rem;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .option-item.selected  .option-badge { background:var(--blue-2); color:#fff; }
        .option-item.correct   .option-badge { background:var(--green); color:#fff; }
        .option-item.incorrect .option-badge { background:var(--red);   color:#fff; }

        /* Hidden radio */
        .option-item input[type=radio] { position:absolute; left:-9999px; opacity:0; }

        @keyframes pulseCorrect {
            0%,100%{ transform:scale(1); }
            40%     { transform:scale(1.03); }
        }
        @keyframes shakeWrong {
            0%,100%{ transform:translateX(0); }
            20%    { transform:translateX(-6px); }
            60%    { transform:translateX(6px); }
        }

        /* ── Progress bar ───────────────────────────────────────────────── */
        .progress { border-radius: 50px; background:#e2e8f0; }
        .progress-bar {
            border-radius: 50px;
            background: linear-gradient(90deg, var(--blue-1), var(--cyan));
            transition: width .4s ease;
        }

        /* ── Question text ──────────────────────────────────────────────── */
        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.7;
            color: #1e293b;
            margin-bottom: 1.5rem;
        }

        /* ── Fixed bottom nav ───────────────────────────────────────────── */
        .fixed-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0,.08);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            padding: .85rem 1rem .5rem;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,.08);
        }

        .nav-row {
            display: flex;
            align-items: center;
            gap: .6rem;
            max-width: 960px;
            margin: 0 auto;
        }

        .question-counter {
            background: #eef2ff;
            color: var(--blue-1);
            border: 1px solid #c7d2fe;
            border-radius: 50px;
            padding: .45rem 1rem;
            font-weight: 700;
            font-size: .9rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .btn-prev { flex: 0 0 auto; }
        .btn-next-wrap { flex: 1; display:grid; }
        .btn-next-wrap > .btn { grid-column:1; grid-row:1; width:100%; }

        .nav-footer {
            text-align: center;
            font-size: .72rem;
            color: #94a3b8;
            margin-top: .35rem;
        }

        .exam-pad { padding-bottom: 110px; }

        /* ── Modals ─────────────────────────────────────────────────────── */
        .modal-content {
            border: none;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }
        .modal-header { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }

        /* ── Question nav grid ──────────────────────────────────────────── */
        .q-nav-btn {
            width: 38px; height: 38px;
            border-radius: var(--radius-sm);
            font-size: .82rem;
            font-weight: 600;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            color: #64748b;
            cursor: pointer;
            transition: var(--transition);
        }
        .q-nav-btn:hover  { border-color: var(--blue-2); color: var(--blue-2); }
        .q-nav-btn.done   { background: var(--green); border-color: var(--green); color:#fff; }
        .q-nav-btn.active { background: var(--blue-2); border-color: var(--blue-2); color:#fff; transform:scale(1.1); }

        /* ── Score display ──────────────────────────────────────────────── */
        .score-ring {
            width: 140px; height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--green) calc(var(--pct)*1%), #e2e8f0 0);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 0 0 8px #f0fdf4;
        }
        .score-inner {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .score-value { font-size: 1.9rem; font-weight: 800; color:#1e293b; line-height: 1; }
        .score-label { font-size: .72rem; color:#64748b; font-weight: 500; }

        /* ── Review cards ───────────────────────────────────────────────── */
        .review-card {
            border-radius: var(--radius-md);
            border: 2px solid #e2e8f0;
            padding: 1rem 1.2rem;
            margin-bottom: .9rem;
            background: #fff;
        }
        .review-card.wrong { border-color: #fca5a5; }
        .review-opt {
            padding: .4rem .8rem;
            border-radius: var(--radius-sm);
            font-size: .9rem;
            margin: .25rem 0;
        }
        .review-opt.user-wrong { background:#fee2e2; color:#b91c1c; }
        .review-opt.correct    { background:#dcfce7; color:#15803d; }

        /* ── Leaderboard table ──────────────────────────────────────────── */
        .lb-table th { font-size: .8rem; color: #475569; font-weight:600; }
        .lb-table td { font-size: .88rem; vertical-align: middle; }
        .lb-me { background: #eef2ff !important; font-weight: 700; }

        /* ── Lobby UI ───────────────────────────────────────────────────── */
        .room-badge {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: .25rem;
            color: var(--blue-1);
            background: #eef2ff;
            border: 2px dashed var(--blue-2);
            border-radius: var(--radius-md);
            padding: .5rem 2rem;
            display: inline-block;
        }

        /* ── Floating action buttons ────────────────────────────────────── */
        .fab {
            position: fixed;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,.9);
            color: var(--blue-1);
            font-size: 1rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            z-index: 1100;
        }
        .fab:hover { background:#fff; box-shadow:var(--shadow-md); transform:scale(1.1); }
        .fab.active { background:var(--blue-1); color:#fff; }
        #fabRandomize { top:16px; left:16px; }
        #fabMute      { top:16px; left:68px; }

        /* ── Alert toast ────────────────────────────────────────────────── */
        .toast-alert {
            position: fixed;
            top: 1rem; right: 1rem;
            z-index: 2000;
            border-radius: var(--radius-md);
            padding: .75rem 1.25rem;
            box-shadow: var(--shadow-md);
            font-size: .9rem;
            font-weight: 500;
            animation: slideInRight .3s ease;
        }
        @keyframes slideInRight {
            from { transform:translateX(120%); opacity:0; }
            to   { transform:translateX(0);    opacity:1; }
        }

        /* ── Footer ─────────────────────────────────────────────────────── */
        .site-footer {
            text-align: center;
            padding: 1rem 0;
            color: rgba(255,255,255,.7);
            font-size: .82rem;
        }

        /* ── Page fade-in ───────────────────────────────────────────────── */
        .page-fade { animation: pageFade .4s ease; }
        @keyframes pageFade {
            from { opacity:0; transform:translateY(10px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ── Responsive ─────────────────────────────────────────────────── */
        @media (max-width: 576px) {
            .question-text { font-size: 1.05rem; }
            .option-item   { padding: .7rem .9rem; }
            .fab { width:40px; height:40px; font-size:.9rem; }
        }
    </style>
</head>

<body>
    <!-- Animated background -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="bg-blob"></div>
        <div class="bg-blob"></div>
        <div class="bg-blob"></div>
    </div>

    <div class="page-wrapper page-fade">
        <div class="content-wrap">
            {% block content %}{% endblock %}
        </div>
    </div>

    <footer class="site-footer">
        صُنع بـ ❤️ بواسطة Raafat Sami
    </footer>

    <!-- Bootstrap bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
